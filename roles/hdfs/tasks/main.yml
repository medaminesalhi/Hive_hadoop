---
- name: Vérifier si NameNode est déjà formaté
  ansible.builtin.stat:
    path: "{{ hdfs_namenode_dir }}/current"
  register: namenode_current_dir

- name: Formater le NameNode si nécessaire
  ansible.builtin.shell: |
    . /etc/profile.d/hadoop.sh
    hdfs namenode -format -force -nonInteractive
  become_user: vagrant
  when: not namenode_current_dir.stat.exists

- name: Démarrer HDFS
  ansible.builtin.shell: |
    . /etc/profile.d/hadoop.sh
    start-dfs.sh
  become_user: vagrant