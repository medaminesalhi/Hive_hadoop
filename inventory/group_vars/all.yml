platforms:
    hadoop: true

cluster_name: bigdata-cluster

java_package: openjdk-11-jdk
java_home: /usr/lib/jvm/java-11-openjdk-amd64

hadoop_version: 3.4.3
hadoop_archive_name: "hadoop-{{ hadoop_version }}.tar.gz"
hadoop_dir_name: "hadoop-{{ hadoop_version }}"
hadoop_download_url: "https://archive.apache.org/dist/hadoop/common/{{ hadoop_dir_name }}/{{ hadoop_archive_name }}"

hadoop_local_archive: "/home/vagrant/cluster-ansible/files/{{ hadoop_archive_name }}"
hadoop_master_archive_path: "/tmp/hadoop-dist/{{ hadoop_archive_name }}"

hadoop_install_dir: /opt
hadoop_target_dir: "{{ hadoop_install_dir }}/{{ hadoop_dir_name }}"
hadoop_home: /opt/hadoop
hadoop_conf_dir: "{{ hadoop_home }}/etc/hadoop"

hdfs_namenode_dir: /var/lib/hadoop/hdfs/namenode
hdfs_datanode_dir: /var/lib/hadoop/hdfs/datanode

namenode_host: master
namenode_private_ip: 192.168.56.10

resourcemanager_host: master
resourcemanager_private_ip: 192.168.56.10

hadoop_mode: standard
hdfs_replication: 2

workers:
  - worker1
  - worker2

mapreduce_framework_name: yarn
yarn_nodemanager_aux_services: mapreduce_shuffle

